# Two modes, one file — see "Making a compose repo runner-ready" in polidoro-runner/README.md.
#
#   standalone     COMPOSE_PROFILES=standalone (the default, from .env) — this repo starts
#                  its own Postgres on :5436 and the backend talks to it over the network.
#   poli-runner    COMPOSE_PROFILES=poli-runner (injected by the runner) — `db` stays down and
#                  POSTGRES_URL comes from the runner. That target lives in poli-runner.yml.
#
# `cp .env.example .env` is step one either way: Compose reads .env in every subcommand.
services:
  db:
    profiles: [standalone]      # bundled DB — omitted in poli-runner mode
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apras
    ports:
      - "5436:5432"
    volumes:
      - postgres_data_alt:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:                      # no profile: always starts, always stops
    # Make the database exist, bring the schema up to date, then serve. The first
    # step is only load-bearing against a Postgres this repo does not own.
    command: >
      sh -c "uv run python -m app.ensure_db &&
             uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    environment:
      # app/core/config.py reads POSTGRES_URL — the DB_* vars this file used to set
      # were never read by anything.
      - POSTGRES_URL             # passthrough: .env standalone, runner in poli-runner mode
      - SECRET_KEY=dev_secret_key_change_me_in_production
      - ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy
        required: false         # without this, an inactive profile invalidates the project
    ports:
      - "8001:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8001/api/v1
      - NODE_ENV=development
    depends_on:
      - backend

volumes:
  postgres_data_alt:
