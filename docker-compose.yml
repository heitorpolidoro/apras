# Local development stack: Postgres, the API and the web UI.
#
# `cp .env.example .env` first. The database lives in the Docker named volume
# `postgres_data_alt`; `docker compose down -v` drops it.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apras
    ports:
      - "5436:5432"
    volumes:
      - postgres_data_alt:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:                      # no profile: always starts, always stops
    # Bring the schema up to date, then serve.
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    environment:
      # app/core/config.py reads POSTGRES_URL — the DB_* vars this file used to set
      # were never read by anything.
      - POSTGRES_URL=postgresql://postgres:postgres@db:5432/apras
      - SECRET_KEY=dev_secret_key_change_me_in_production
      - ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8001/api/v1
      - NODE_ENV=development
    depends_on:
      - backend

volumes:
  postgres_data_alt:
