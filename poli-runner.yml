# This repo ships two runnable things, so it declares two systems rather than one.
# They are ordinary catalog entries: `poli-runner start apras-backend` runs just the
# API, and the front end pulls the API in through depends_on.
systems:
  - name: apras-backend
    alias: ab
    description: APRAS API — FastAPI on :8001
    commands:
      # Naming `backend` is safe: it carries no profile. In standalone mode compose
      # also pulls in `db` (backend depends on it); in poli-runner mode `db` is
      # profiled off, so only the API comes up.
      start: docker compose up -d backend
      stop:  docker compose stop backend
      logs:  docker compose logs $FOLLOW --tail=200 backend
      status:
        url: http://localhost:8001/docs
        # Identify the service, not the port: any code under 500 counts as up, so
        # without this an unrelated server on :8001 reads as healthy.
        body_contains: APRAS
        timeout_secs: 180
    depends_on: [postgres]
    integrations:
      postgres:
        description: Shared dev Postgres (:54321)
        # No `mock` scenario on purpose: when postgres is not in the run the runner
        # injects nothing, .env applies, and the bundled database starts instead.
        local:
          COMPOSE_PROFILES: poli-runner
          POSTGRES_URL: postgresql://postgres:postgres@host.docker.internal:54321/apras

  - name: apras-frontend
    # `apras` lands here on purpose: the front end is what you normally want, and
    # depends_on drags the API up behind it. Note `stop apras` then stops only the
    # front end — stop never expands dependencies.
    alias: [apras, af]
    description: APRAS web UI — Vite on :3001
    commands:
      # --no-deps matters: without it compose would start `backend` itself, missing
      # the POSTGRES_URL the runner injects into the backend's own start.
      start: docker compose up -d --no-deps frontend
      stop:  docker compose stop frontend
      logs:  docker compose logs $FOLLOW --tail=200 frontend
      status:
        url: http://localhost:3001/
        body_contains: APRAS
        timeout_secs: 180
    depends_on: [apras-backend]
