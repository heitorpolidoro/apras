name: apras
alias: ap
description: APRAS — FastAPI backend (:8001) + Vite frontend (:3001)

commands:
  # The backend creates its own database and migrates on start — see
  # backend/app/ensure_db.py and the `command:` in docker-compose.yml.
  start: docker compose up -d
  stop:  docker compose stop
  logs:  docker compose logs $FOLLOW --tail=200
  status:
    url: http://localhost:8001/docs
    timeout_secs: 180

depends_on: [postgres]

integrations:
  postgres:
    description: Shared dev Postgres (:54321)
    # No `mock` scenario on purpose: when postgres is not in the run the runner injects
    # nothing, .env applies, and docker-compose.yml starts this repo's own database.
    local:
      COMPOSE_PROFILES: poli-runner
      POSTGRES_URL: postgresql://postgres:postgres@host.docker.internal:54321/apras
