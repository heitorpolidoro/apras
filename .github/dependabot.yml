version: 2

updates:
  # Backend. The ecosystem is `uv`, not `pip`: `pip` would drive only the
  # generated `backend/requirements.txt` and leave `backend/uv.lock` behind,
  # manufacturing exactly the two-files-disagree state that let 57 alerts
  # accumulate (APRAS-116).
  #
  # What `uv` does *not* do is regenerate the export. It updates
  # `pyproject.toml` and `uv.lock` from a real resolution, and then edits
  # `backend/requirements.txt` as if it were a hand-maintained pip manifest --
  # bumping each pin to that package's own latest release, line by line, with
  # no resolver behind it. `cd8de18` (PR #47) is the shape: 25 single-line
  # bumps that left `pydantic==2.13.5` beside `pydantic-core==2.49.0`, a set
  # that is not merely stale but uninstallable. Do not expect a future
  # dependabot release to start doing it.
  #
  # `.github/workflows/requirements-export.yml` is what regenerates the export
  # on these pull requests, from `backend/uv.lock`, by running
  # `backend/scripts/export_requirements.sh` and pushing one commit onto the
  # pull request's branch. One side effect to expect: dependabot stops
  # force-pushing a branch it sees as modified by another author, so after that
  # push it will no longer rebase or re-drive the pull request. A pull request
  # left open long enough to go stale must be closed and reopened by
  # dependabot rather than waited on for a rebase that will not come.
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    # Weekly and capped: there is one maintainer, and the failure mode this
    # config exists to prevent is a queue nobody reads.
    open-pull-requests-limit: 3
    groups:
      # One PR per week for all minor/patch version updates. Majors are
      # deliberately left ungrouped so each arrives as its own reviewable PR.
      backend-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          # `ruff` is pinned exactly in `backend/pyproject.toml` because its
          # rule set and its formatter both move between minor releases, and
          # the `backend-lint` gate must not fail on a change that did not
          # cause it. Bumping it is a deliberate one-line PR that re-runs the
          # same harness (APRAS-54 §4.1), so it must not be swept into the
          # grouped version-update PR. Excluded from the group rather than
          # `ignore`d: `ignore` would suppress its security updates too.
          - "ruff"
      # Security fixes stay batched instead of arriving one per advisory,
      # which is how 57 alerts became unreadable.
      backend-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # Frontend.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      frontend-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      frontend-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
