version: 2

updates:
  # Backend. The ecosystem is `uv`, not `pip`: `pip` would drive only the
  # generated `backend/requirements.txt` and leave `backend/uv.lock` behind,
  # manufacturing exactly the two-files-disagree state that let 57 alerts
  # accumulate (APRAS-116). `uv` updates `pyproject.toml`, `uv.lock` and the
  # export together.
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    # Weekly and capped: there is one maintainer, and the failure mode this
    # config exists to prevent is a queue nobody reads.
    open-pull-requests-limit: 3
    groups:
      # One PR per week for all minor/patch version updates. Majors are
      # deliberately left ungrouped so each arrives as its own reviewable PR.
      backend-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          # `ruff` is pinned exactly in `backend/pyproject.toml` because its
          # rule set and its formatter both move between minor releases, and
          # the `backend-lint` gate must not fail on a change that did not
          # cause it. Bumping it is a deliberate one-line PR that re-runs the
          # same harness (APRAS-54 §4.1), so it must not be swept into the
          # grouped version-update PR. Excluded from the group rather than
          # `ignore`d: `ignore` would suppress its security updates too.
          - "ruff"
          # `sqlmodel` 0.0.47 replaced the plain datetime column type with
          # `UTCDateTime`, which raises on any value carrying no tzinfo. Every
          # datetime column here is naive on purpose: all 110 are `sa.DateTime()`,
          # `timezone=True` appears in none of the 38 migrations, and
          # `app/core/clock.db_now()` drops tzinfo so a value read back compares
          # against one written (APRAS-54). The bump is a schema decision, tracked
          # as APRAS-120, not a routine minor release.
          #
          # Excluded because the group succeeds or fails as a unit: held inside
          # it, one design decision blocked the other 25 packages -- fastapi,
          # alembic, psycopg2, pytest -- through PR #36 and again through PR #42.
          # The reach was wider than it looked, too: `tests/conftest.py`'s
          # `default_tenant_fixture` is autouse and commits, so the raise landed
          # in setup for every test under `tests/` -- including
          # `test_lint_hygiene.py`, which only reads source files and touches no
          # database, and including `test_migrations_postgres.py`, which is why
          # the Postgres job failed for this and not for the alembic bump beside
          # it.
          #
          # Excluded rather than `ignore`d, for `ruff`'s reason: a security
          # advisory against sqlmodel must still open its own PR. Remove this
          # line once APRAS-120 lands.
          - "sqlmodel"
      # Security fixes stay batched instead of arriving one per advisory,
      # which is how 57 alerts became unreadable.
      backend-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # Frontend.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      frontend-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      frontend-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
