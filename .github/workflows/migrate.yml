name: Migrate

on:
  push:
    branches: [ master ]

jobs:
  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
    - uses: actions/checkout@v6

    - uses: astral-sh/setup-uv@v8.1.0
      with:
        enable-cache: false
        pyproject-file: backend/pyproject.toml

    - run: uv python install 3.13

    - run: cd backend && uv sync --all-groups

    - name: Stamp squashed revision if needed
      run: |
        psql "$POSTGRES_URL" -c \
          "UPDATE alembic_version SET version_num = '0001' WHERE version_num = '0005';"

    - run: cd backend && uv run alembic upgrade head
