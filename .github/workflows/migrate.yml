name: Migrate

on:
  push:
    branches: [ master ]

jobs:
  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
    - uses: actions/checkout@v6

    - uses: astral-sh/setup-uv@v8.1.0
      with:
        # See `ci.yml`'s note: the project-file input this step used to pass is
        # not declared by this action, so uv floated here too.
        # This job is the exposed one -- it holds POSTGRES_URL_NON_POOLING and
        # runs `alembic upgrade head` against production -- so it must not be
        # the one place uv floats.
        version: "0.12.19"
        enable-cache: false

    - run: uv python install 3.13

    - run: cd backend && uv sync --all-groups

    - run: cd backend && uv run alembic upgrade head
