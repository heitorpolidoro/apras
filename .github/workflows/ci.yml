name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # This repository does not ship through pull requests, so without a manual
  # trigger no run can be produced on any ref but `master`. The `push` and
  # `pull_request` filters stay `[ master ]`: this adds a way to ask for a run,
  # not a new automatic one.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    # Without this the job inherits GitHub's six-hour default. A run that
    # hung after the tests had already passed burned exactly 365 minutes
    # before it was cancelled; `backend-migrations` below has carried a
    # timeout all along.
    #
    # It is the *last* backstop, not the first one, and deliberately so: a job
    # this cancels usually publishes **no logs at all**, which is why 11 of the
    # 15 occurrences APRAS-119's census found could not be diagnosed from CI.
    #
    # The `timeout` wrapper on the pytest step below turns *some* hangs into a
    # failing step with a readable log, and it is important not to overstate
    # which: it worked on job 110381880180 (step failed at 30m08s, exit code
    # 124, log published) and it did **not** work on jobs 110014916546 and
    # 110405490008, where output stopped at the 30m mark and the step then
    # never completed at all -- the job sat until this `timeout-minutes`
    # cancelled it. See `docs/tasks/APRAS-119-findings.md`.
    #
    # Note what the job span means here. GitHub adds a fixed grace window after
    # a `timeout-minutes` cancellation, so a job cancelled at 45m records a
    # ~55m span. That is platform behaviour, not this backstop overshooting:
    # every one of those jobs carries the annotation "The job has exceeded the
    # maximum execution time of 45m0s".
    timeout-minutes: 45
    env:
      SECRET_KEY: "test-secret-key-for-ci"
      POSTGRES_URL: "postgresql://postgres:password@localhost/apras"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        # A literal, and not the project-file input these steps used to pass:
        # that one is not declared by this action, so it was ignored with a
        # warning and every job floated to latest uv (0.12.21 on run
        # 36924174723, against 0.12.19 locally). Every `setup-uv` step in this
        # repository holds the same literal, and
        # `backend/tests/test_workflow_actions.py` fails if they disagree.
        version: "0.12.19"
        enable-cache: false

    - name: Set up Python 3.13
      run: uv python install 3.13

    - name: Install dependencies
      run: |
        cd backend
        uv sync --all-groups

    # `timeout` here, and not only `timeout-minutes` above, because the two
    # kill the run in opposite ways. `timeout-minutes` cancels the *job*, and a
    # cancelled job's logs are unavailable; `timeout` fails a *step*, so
    # everything pytest wrote before it wedged -- the summary line it had
    # already reached, and `pytest-timeout`'s dump of every thread's stack when
    # one test is the one stuck -- is in the log the next person opens.
    #
    # 30m against a ~11m steady state: enough head-room for a slow runner,
    # short enough that a hang costs a third of what it used to. `--signal=INT`
    # first so pytest can still print its own summary and coverage report, and
    # SIGKILL 60s later for a process too wedged to answer.
    #
    # `timeout` signals its direct child, and that child is `uv`, not pytest.
    # Probed on darwin (APRAS-119 §4a), `uv` does forward SIGINT and the pytest
    # grandchild dies, so the wrapper is not left signalling into a void -- but
    # that probe does not settle the ubuntu runner, where job 109628456192's log
    # ends with `Terminate orphan process: pid (2355) (uv)` and
    # `pid (2359) (pytest)`. The backstop that cannot be defeated this way is
    # `tests/conftest.py`'s `faulthandler` shutdown watchdog, which acts from
    # inside the pytest process.
    - name: Run tests with coverage
      run: |
        cd backend
        timeout --signal=INT --kill-after=60s 30m \
          uv run pytest --cov=app --cov-report=xml:coverage.xml --junitxml=test-results.xml tests/

    - name: Upload Backend Test Data
      uses: actions/upload-artifact@v7
      with:
        name: backend-test-data
        path: |
          backend/coverage.xml
          backend/test-results.xml

  # A separate job, not a bigger `backend` one: 16 of the module's 20 cases
  # re-run the migration twice (fixture setup and teardown), so
  # folding it in would add that cost to the job every change waits on. As its
  # own job it runs in parallel, `Backend Tests`'s duration is unchanged by
  # construction, and "Backend Migration Tests (Postgres) x" names the failure
  # class before anyone opens a log. `sonarcloud`'s `needs:` is deliberately
  # not extended -- this job feeds it nothing.
  backend-migrations:
    name: Backend Migration Tests (Postgres)
    runs-on: ubuntu-latest
    # A backstop against a hung `alembic` subprocess holding a runner, not a
    # budget: the steady-state cost is a couple of minutes.
    timeout-minutes: 20
    env:
      SECRET_KEY: "test-secret-key-for-ci"
      TEST_POSTGRES_URL: "postgresql://postgres:postgres@localhost:5432/apras_test"
      # `app/db.py` builds an engine at import time. Pointing it at the same
      # throwaway database means any accidental connection lands somewhere
      # harmless, and keeps `_alembic`'s POSTGRES_URL override a no-op.
      POSTGRES_URL: "postgresql://postgres:postgres@localhost:5432/apras_test"

    services:
      postgres:
        # The same tag as `docker-compose.yml`'s `db` and the same major as
        # production (AGENTS.md, "PostgreSQL 16"). If one of the three moves,
        # all three move together.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apras_test
          # The migration seeds the non-ASCII `Condomínio Padrão`, so the
          # cluster must be UTF-8. The image's `LANG` already makes `initdb`
          # default to UTF8; stating it here survives an image whose `LANG`
          # changes, and `--locale=C` fixes collation instead of inheriting
          # whichever locales the base image happens to carry.
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          # The steps run on the runner host, not inside a container, so the
          # service has to be reachable on localhost.
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apras_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        # The same literal as the `backend` job above, for the reason recorded
        # there. Bump every one of them in one commit or the guard goes red.
        version: "0.12.19"
        enable-cache: false

    - name: Set up Python 3.13
      run: uv python install 3.13

    - name: Install dependencies
      run: |
        cd backend
        uv sync --all-groups

    - name: Verify the throwaway database is UTF-8
      run: |
        enc=$(psql "$TEST_POSTGRES_URL" -tAc "SHOW server_encoding")
        echo "server_encoding=$enc"
        test "$enc" = "UTF8"

    # Wrapped for the same reason the `backend` job's step is: this job's
    # `timeout-minutes` cancels it and publishes nothing, and its own note
    # above already names a hung `alembic` subprocess as what it guards
    # against. A step that fails at 15m leaves the log that says which case.
    - name: Run Postgres migration tests
      run: |
        cd backend
        timeout --signal=INT --kill-after=60s 15m \
          uv run pytest tests/test_migrations_postgres.py -v --durations=15 \
          --junitxml=migration-test-results.xml -o addopts=

    # `if: always()` is required: a green-but-empty pytest run is the exact
    # failure this guard exists to catch, and it would never reach a step that
    # only ran after a *failing* pytest.
    - name: Assert every migration case actually ran
      if: always()
      run: |
        cd backend
        uv run python scripts/assert_no_skips.py migration-test-results.xml

  # Its own job, for the same reason `backend-migrations` is: it runs in
  # parallel, `Backend Tests`'s duration is unchanged by construction, and
  # "Backend Lint (ruff)" names the failure class before anyone opens a log.
  # `sonarcloud`'s `needs:` is deliberately not extended -- this job feeds it
  # no artefact.
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    # Without this the job inherits GitHub's six-hour default, and a wedged
    # `uv sync` would hold a runner for a quarter of a day over a job whose
    # steady state is ten seconds. Measured over the 41 successful `ci.yml`
    # runs since 2026-08-01: median 0.17m, p90 0.28m, worst 1.85m. 10m is 5x
    # the worst observed, so only a genuine wedge reaches it.
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        # The same literal as the `backend` job above, for the reason recorded
        # there. Bump every one of them in one commit or the guard goes red.
        version: "0.12.19"
        enable-cache: false

    - name: Set up Python 3.13
      run: uv python install 3.13

    - name: Install dependencies
      run: |
        cd backend
        uv sync --all-groups

    # Two commands, not one: `check` and `format` fail for different reasons
    # and a reviewer should not have to read a log to tell which.
    # `--output-format=github` annotates the finding on the diff.
    # No `--exit-zero`, no `--fix`, no `continue-on-error`: any finding fails
    # the job. `uv run` uses the version pinned in `pyproject.toml`, so the
    # local and CI readings agree.
    - name: ruff check
      run: |
        cd backend
        uv run ruff check . --output-format=github

    - name: ruff format --check
      run: |
        cd backend
        uv run ruff format --check .

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    # Same reason as `backend-lint`, against this job's own steady state:
    # median 2.55m, p90 2.80m, worst 3.37m over the same 41 runs. 15m is 4.5x
    # the worst observed and leaves room for `npm ci` on a cold cache.
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Type-check and build
      run: |
        cd frontend
        npm run build

    - name: Run tests with coverage
      run: |
        cd frontend
        npm run test:coverage

    - name: Upload Frontend Coverage
      uses: actions/upload-artifact@v7
      with:
        name: frontend-coverage
        path: frontend/coverage/lcov.info

  sonarcloud:
    name: SonarCloud Scan
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # Same reason again: median 1.17m, p90 2.03m, worst 2.32m over the same 41
    # runs. 15m rather than 10m because this is the one job that waits on a
    # third party -- the scanner uploads to SonarCloud and retries -- so its
    # tail is not governed by this repository.
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Download Backend Test Data
      uses: actions/download-artifact@v8
      with:
        name: backend-test-data
        path: backend

    - name: Download Frontend Coverage
      uses: actions/download-artifact@v8
      with:
        name: frontend-coverage
        path: frontend/coverage

    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@v7
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
