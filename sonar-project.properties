# This key must name a project that ALREADY EXISTS in the SonarCloud
# organization below. Changing it here does not rename anything on
# SonarCloud's side: it only redirects where the scanner reports to. Point it
# at a key that does not exist and the analysis either fails or silently
# provisions a fresh, empty project -- which loses the whole history and
# leaves the old project frozen at its last analysis.
#
# That is exactly what happened before: `heitorpolidoro_sigecon` was renamed
# to `heitorpolidoro_nexdom` in a42fb29 (2026-06-12), so the `sigecon`
# project's last analysed pull request is #25 and every PR since went to
# `nexdom`. Looking at the old project made it appear that Sonar had stopped
# running. Rename the project in SonarCloud FIRST (Administration → Update
# Key, which preserves history), then move this line.
sonar.projectKey=heitorpolidoro_apras
sonar.organization=heitorpolidoro
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src
# `**/tests**` does not match `__tests__`: they are different directory
# names, and a helper under `__tests__/` that is not itself named
# `*.test.ts` was therefore analysed as production source and had its
# coverage counted. That is how APRAS-118's `obraReportFixture.ts` -- 143
# lines of test data -- came to supply half of a failing 93.6% `new_coverage`
# measurement. It was the project's first such helper, so the gap had been
# latent: all 185 existing test files match the `*.test.ts` patterns above.
sonar.test.inclusions=**/*.test.tsx,**/*.test.ts,**/tests/**,**/__tests__/**
sonar.exclusions=**/node_modules/**,**/.git/**,**/.venv/**,**/__pycache__/**,**/alembic/versions/**,**/dist/**,**/public/**,**/coverage/**,**/*.html,backend/app/db.py,backend/app/seed*.py,frontend/src/main.tsx,frontend/src/test/**
sonar.coverage.exclusions=frontend/src/test/**,**/__tests__/**
sonar.javascript.exclusions=**/coverage/**
sonar.css.exclusions=**/coverage/**
sonar.cpd.exclusions=**/coverage/**

# Python specific analysis
sonar.python.version=3.13
sonar.python.xunit.reportPath=backend/test-results.xml
sonar.python.coverage.reportPaths=backend/coverage.xml

# JS/TS specific analysis
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.tsconfigPath=frontend/tsconfig.json
