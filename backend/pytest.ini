[pytest]
pythonpath = .
testpaths = tests
addopts = --cov=app --cov-fail-under=90

# `Backend Tests` was cancelled at 55m0s twice in a row on a commit whose
# backend tree was byte-identical to one that had passed in 10m57s, and a job
# killed by `timeout-minutes` publishes no logs at all -- so neither run said
# where it stopped. These two lines are what make the next occurrence say it.
#
# 300s is 6x the slowest case in the suite -- 50.0s, `test_branding.py`'s
# `test_the_brand_surface_lattice_never_fails_and_never_leaves_the_gamut`, with
# the next one at 7.9s -- so nothing healthy is near it even on a runner
# slower than this one. What it catches is a test that has stopped making
# progress, and it names that test instead of letting it own the runner until
# the job is cancelled.
timeout = 300
# `thread`, not pytest-timeout's default `signal`, and the difference is the
# point. `SIGALRM` is delivered to the main thread only, so it cannot interrupt
# a wait that is happening *inside* a helper thread -- which is the shape a
# leaked `TestClient` portal or an unjoined pool worker produces, and the shape
# that also stops the interpreter exiting after the summary is printed. The
# thread method dumps every thread's stack and ends the process, which is
# exactly the evidence the two cancelled runs could not produce.
timeout_method = thread
