[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    # `bcrypt` directly, with no passlib in front of it: passlib 1.7.4 is that
    # project's last release (2020-10-08) and cannot initialise a bcrypt 5
    # backend at all. `app/core/security.BcryptHasher` replaced it.
    "bcrypt<5.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "pillow>=11.0.0",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.31",
    "slowapi>=0.1.10",
    "sqlmodel>=0.0.47",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    "qrcode>=8.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    # Reads `pytest.ini`'s `timeout` / `timeout_method`. Without it those two
    # settings are an "Unknown config option" warning and nothing else, which
    # is why `tests/test_suite_hygiene.py` asserts this line exists.
    "pytest-timeout>=2.4.0",
    # Exact, never `>=`: ruff's rule set and its formatter both move between
    # minor releases, and the one thing the `backend-lint` gate must not do is
    # fail on a change that did not cause it. Bumping ruff is a deliberate
    # one-line PR that re-runs the same harness (APRAS-54 §4.1).
    "ruff==0.16.9",
    "zxing-cpp>=3.1.1",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",      # Docstrings (opcional para agora)
    "COM812", # Trailing comma
    "ANN",    # Type annotations (muito verboso)
    "FA",     # Future annotations
    "FIX",    # TODOs
    "TD",     # TODOs
    "T20",    # Print statements
    "EM",     # Error messages
    "TRY",    # Try-except patterns
    "FBT",    # Boolean trap
    "C901",   # Complexidade
    "RET505", # Unnecessary else after return
    "RET506",
    "RET507",
    "RET508",
    "PTH",    # Pathlib (os.path é ok)
    "ISC001", # Implicit string concatenation (conflita com formatter)
    "CPY001", # Copyright notice
    "PLR0913", # Too many arguments
    "PLR0917", # Too many positional arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # Assert em testes
    "PLR2004", # Magic numbers em testes
    "S105",    # Hardcoded passwords em testes
    "S106",    # Hardcoded passwords em testes
    "ARG001",  # Unused arguments em fixtures/testes (frequente)
    "ARG002",  # idem, na forma de método (stubs de serviço, fixtures de classe)
    "E501",    # Line too long em testes
    # A test that imports a model or a service inside the test function is
    # controlling import order relative to its fixtures and to `app.main`'s
    # import-time side effects. Hoisting all 90 is a real risk taken for a
    # cosmetic gain. Precedent: `app/services/task_service.py` below.
    "PLC0415",
    # A test asserting on `TaskService._resolve_user` is testing the unit it
    # means to test. Seven per-line `noqa`s used to say this one file at a
    # time; this entry replaces them.
    "SLF001",
    # `tests/test_migrations_postgres.py` shells out to `alembic` on purpose
    # and the argv is a literal. `S607` reports nothing today; it is `S603`'s
    # companion on that same call, and the pair is stated together so a
    # partial-path invocation does not have to re-litigate it.
    "S603",
    "S607",
]
# CI helpers, deliberately outside `tests/` (`testpaths = tests` must not
# collect them) and outside any package, so they have no `__init__.py`.
"scripts/**" = ["INP001"]
"alembic/**" = [
    "INP001", # Namespace package
    "N806",   # Variable names em migrations
    "E501",    # Line too long em migrations
    "ERA001", # Código comentado em env.py
]
"app/services/task_service.py" = ["PLC0415", "INP001"]
"app/api/**" = ["INP001", "E501"]
# All 36 are path parameters. FastAPI derives `/{id}` from the parameter
# *name*, so renaming `id` would change the URL and the OpenAPI path
# template -- a public API break. Shadowing the builtin is the price of the
# route contract, and it is paid deliberately.
"app/api/v1/endpoints/**" = ["A002"]
"app/core/**" = ["INP001", "E501"]
# The approved report's CSS is one module-level constant, ported rule for rule
# from `docs/tasks/APRAS-60-mock-generator.py` so the emitted document stays
# diffable against the approved mock. Re-wrapping ~90 declarations under 88
# columns destroys exactly that property and buys nothing: CSS ignores the
# line breaks either way.
"app/services/project_report_service.py" = ["E501"]
"app/models/**" = ["INP001"]
# RUF012 flags a mutable class-attribute default, and it exempts pydantic
# models -- but only when it can *see* that the class is one. APRAS-120 moved
# all 203 schema classes from `BaseModel` to `ApiModel`, the shared base that
# makes every response datetime carry its UTC offset, and ruff resolves a base
# class only within the file that names it: `class X(BaseModel)` is recognised,
# `class X(ApiModel)` with `ApiModel` imported from `app/schemas/base.py` is
# not. Verified on a two-file minimal case -- the direct subclass is clean and
# the aliased one reports RUF012 on an identical `list[str] = []`.
#
# So all 22 findings under `app/schemas/` are false positives on *pydantic
# field defaults*, which pydantic deep-copies per instance and which were
# therefore never the shared-mutable-state bug the rule is about. The 22 did
# not exist before the sweep and no mutable default was introduced by it. The
# alternative was 22 per-line suppressions, which would have raised the cap
# `tests/test_lint_hygiene.py` holds at 72 by 22 for a rule that is wrong here
# in every instance -- and the APRAS-120 spec explicitly declines to raise it.
# Scoped to this one directory so the rule keeps working everywhere else.
"app/schemas/**" = ["INP001", "RUF012"]
"app/main.py" = ["INP001"]
"app/db.py" = ["INP001"]
"app/seed.py" = ["INP001", "T201"]
# Migrations are frozen history. `alembic upgrade` replays them verbatim
# against production; a reformat or an import-sort of a file that already ran
# buys nothing and puts 28 files of pure noise in front of a reviewer. This
# entry is what makes a stray `ruff --fix` over them structurally impossible
# rather than a habit.
"alembic/versions/**" = [
    "UP007", "UP045", "UP006", "UP035",   # PEP 604/585 rewrites of settled code
    "Q000", "Q003",                       # quote style of generated stubs
    "I001",                               # import order of generated stubs
    "F401",                               # `sqlmodel` imported for its side effect
    "PLR2004", "PIE790", "COM819",
    "RUF100",                             # a stale noqa here is also history
]

[tool.ruff.format]
# Same reason. The linter still reads these files (the ignores above are
# narrow and a genuinely new problem still fails the gate); the formatter is
# simply never allowed to rewrite them.
exclude = ["alembic/versions/*.py"]

# Not for us -- `ruff check` does our import sorting, and this project runs no
# standalone isort. This section is for the repository's style bot, which runs
# `isort` over the files a pull request touches and pushes the result onto the
# branch. Plain isort's defaults classify `app` as *third-party*, so it merges
# the first-party block into the third-party one and every touched file then
# fails ruff's `I001` -- which is what broke the required `Backend Lint (ruff)`
# check on this branch, on code that was ruff-clean when pushed.
#
# isort reads the nearest config walking up from each file, so these keys reach
# it for everything under `backend/`. `known_first_party` is the fix; `profile`
# and `line_length` keep the rest of its output matching the ruff formatter.
[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["app", "tests"]

[tool.coverage.run]
omit = [
    "app/seed.py",
    "app/db.py"
]
