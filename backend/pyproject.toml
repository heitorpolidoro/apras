[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt<4.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.136.0",
    "passlib[bcrypt]>=1.7.4",
    "pillow>=11.0.0",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.27",
    "slowapi>=0.1.9",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.44.0",
    "httpx>=0.28.1",
    "qrcode>=8.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    # Exact, never `>=`: ruff's rule set and its formatter both move between
    # minor releases, and the one thing the `backend-lint` gate must not do is
    # fail on a change that did not cause it. Bumping ruff is a deliberate
    # one-line PR that re-runs the same harness (APRAS-54 §4.1).
    "ruff==0.16.5",
    "zxing-cpp>=3.1.1",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",      # Docstrings (opcional para agora)
    "COM812", # Trailing comma
    "ANN",    # Type annotations (muito verboso)
    "FA",     # Future annotations
    "FIX",    # TODOs
    "TD",     # TODOs
    "T20",    # Print statements
    "EM",     # Error messages
    "TRY",    # Try-except patterns
    "FBT",    # Boolean trap
    "C901",   # Complexidade
    "RET505", # Unnecessary else after return
    "RET506",
    "RET507",
    "RET508",
    "PTH",    # Pathlib (os.path é ok)
    "ISC001", # Implicit string concatenation (conflita com formatter)
    "CPY001", # Copyright notice
    "PLR0913", # Too many arguments
    "PLR0917", # Too many positional arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # Assert em testes
    "PLR2004", # Magic numbers em testes
    "S105",    # Hardcoded passwords em testes
    "S106",    # Hardcoded passwords em testes
    "ARG001",  # Unused arguments em fixtures/testes (frequente)
    "ARG002",  # idem, na forma de método (stubs de serviço, fixtures de classe)
    "E501",    # Line too long em testes
    # A test that imports a model or a service inside the test function is
    # controlling import order relative to its fixtures and to `app.main`'s
    # import-time side effects. Hoisting all 90 is a real risk taken for a
    # cosmetic gain. Precedent: `app/services/task_service.py` below.
    "PLC0415",
    # A test asserting on `TaskService._resolve_user` is testing the unit it
    # means to test. Seven per-line `noqa`s used to say this one file at a
    # time; this entry replaces them.
    "SLF001",
    # `tests/test_migrations_postgres.py` shells out to `alembic` on purpose
    # and the argv is a literal. `S607` reports nothing today; it is `S603`'s
    # companion on that same call, and the pair is stated together so a
    # partial-path invocation does not have to re-litigate it.
    "S603",
    "S607",
]
# CI helpers, deliberately outside `tests/` (`testpaths = tests` must not
# collect them) and outside any package, so they have no `__init__.py`.
"scripts/**" = ["INP001"]
"alembic/**" = [
    "INP001", # Namespace package
    "N806",   # Variable names em migrations
    "E501",    # Line too long em migrations
    "ERA001", # Código comentado em env.py
]
"app/services/task_service.py" = ["PLC0415", "INP001"]
"app/api/**" = ["INP001", "E501"]
# All 36 are path parameters. FastAPI derives `/{id}` from the parameter
# *name*, so renaming `id` would change the URL and the OpenAPI path
# template -- a public API break. Shadowing the builtin is the price of the
# route contract, and it is paid deliberately.
"app/api/v1/endpoints/**" = ["A002"]
"app/core/**" = ["INP001", "E501"]
"app/models/**" = ["INP001"]
"app/schemas/**" = ["INP001"]
"app/main.py" = ["INP001"]
"app/db.py" = ["INP001"]
"app/seed.py" = ["INP001", "T201"]
# Migrations are frozen history. `alembic upgrade` replays them verbatim
# against production; a reformat or an import-sort of a file that already ran
# buys nothing and puts 28 files of pure noise in front of a reviewer. This
# entry is what makes a stray `ruff --fix` over them structurally impossible
# rather than a habit.
"alembic/versions/**" = [
    "UP007", "UP045", "UP006", "UP035",   # PEP 604/585 rewrites of settled code
    "Q000", "Q003",                       # quote style of generated stubs
    "I001",                               # import order of generated stubs
    "F401",                               # `sqlmodel` imported for its side effect
    "PLR2004", "PIE790", "COM819",
    "RUF100",                             # a stale noqa here is also history
]

[tool.ruff.format]
# Same reason. The linter still reads these files (the ignores above are
# narrow and a genuinely new problem still fails the gate); the formatter is
# simply never allowed to rewrite them.
exclude = ["alembic/versions/*.py"]

[tool.coverage.run]
omit = [
    "app/seed.py",
    "app/db.py"
]
